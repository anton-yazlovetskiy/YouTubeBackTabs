<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 180px; font-family: sans-serif; padding: 15px; text-align: center; }
    .label { font-size: 12px; color: #666; margin-bottom: 10px; }
    .speed-controls { display: flex; align-items: center; justify-content: center; gap: 15px; }
    .circle-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f00; color: white; font-size: 18px; cursor: pointer; }
    #speedValue { font-weight: bold; font-size: 16px; min-width: 50px; }
  </style>
</head>
<body>
  <div class="label">Speed</div>
  <div class="speed-controls">
    <button id="minus" class="circle-btn">−</button>
    <span id="speedValue">1.50x</span>
    <button id="plus" class="circle-btn">+</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
